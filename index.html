<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>모소 월드 · 동원 님 비서실</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f6f1e7;
      --surface: #fffdf8;
      --surface-2: #f1e8d9;
      --border: #e3d6c2;
      --text: #2f261d;
      --muted: #827362;
      --accent: #8b5a2b;
      --accent-dark: #6f4620;
      --accent-soft: #efe2cf;
      --green: #1e8e5a;
      --green-bg: #e7f6ee;
      --amber: #b86e00;
      --amber-bg: #fff4df;
      --blue: #2563eb;
      --blue-bg: #eaf1ff;
      --shadow: 0 8px 24px rgba(68, 46, 22, 0.08);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 780px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    /* Header */
    .header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--accent-soft);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--green);
      display: inline-block;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid #c6ebd7;
      white-space: nowrap;
    }

    .status-pill.offline {
      background: #fdecec;
      color: #c23939;
      border-color: #f6c9c9;
    }

    .status-pill.offline .dot {
      background: #c23939;
    }

    /* Main Navigation */
    .main-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 8px;
    }

    .tab-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 12px;
      padding: 10px 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.15s ease;
    }

    .tab-btn .ico { font-size: 17px; }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 12px rgba(139, 90, 43, 0.25);
    }

    /* Panels */
    .panel {
      display: none;
      flex: 1;
      flex-direction: column;
      gap: 10px;
    }
    .panel.active { display: flex; }

    .room-meta {
      padding: 12px 16px 10px;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px dashed var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Chat messages */
    .chat-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 460px;
      max-height: 68dvh;
      overflow: hidden;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .msg-body-wrap {
      flex: 1;
      min-width: 0;
    }

    .msg-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .msg-name {
      font-size: 13px;
      font-weight: 800;
    }

    .msg-role {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    .msg-time {
      font-size: 11px;
      color: var(--muted);
      margin-left: 2px;
    }

    .msg-bubble {
      background: #faf5ec;
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
      padding: 10px 13px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg-bubble a {
      color: var(--accent-dark);
      text-decoration: underline;
    }

    .msg-row.is-owner .msg-bubble {
      background: #f3e7d5;
      border-color: #d9c3a5;
    }

    .chat-compose {
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      background: var(--surface);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    select, input[type="text"], input[type="search"], textarea {
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      outline: none;
    }

    select:focus, input[type="text"]:focus, input[type="search"]:focus, textarea:focus {
      border-color: var(--accent);
    }

    .chat-compose select {
      padding: 10px;
      font-weight: 700;
    }

    .chat-compose input {
      flex: 1;
      min-width: 160px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 16px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover { background: var(--accent-dark); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-ghost {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Tasks */
    .section-card {
      padding: 14px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 800;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .task-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-form-row {
      display: flex;
      gap: 8px;
    }

    .task-form-row select { width: 145px; }
    .task-form-row .btn { flex: 1; }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      padding: 13px 14px;
      border-radius: 14px;
      background: #faf5ec;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .task-title {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.4;
    }

    .badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid transparent;
    }

    .badge-assignee {
      background: var(--accent-soft);
      color: var(--accent-dark);
      border-color: #decab0;
    }

    .badge-대기 { background: var(--amber-bg); color: var(--amber); border-color: #f3dfb7; }
    .badge-진행중 { background: var(--blue-bg); color: var(--blue); border-color: #c7d9ff; }
    .badge-완료 { background: var(--green-bg); color: var(--green); border-color: #c2e7d3; }

    .task-result {
      font-size: 13px;
      color: #463a2e;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .task-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
    }

    /* Agents */
    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .agent-card {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .agent-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .agent-who {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .agent-emoji {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .agent-name { font-size: 15px; font-weight: 800; }
    .agent-role { font-size: 12px; color: var(--muted); }

    .agent-task {
      font-size: 13px;
      background: #faf5ec;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      line-height: 1.45;
    }

    /* Documents (저장소) */
    .docs-toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .docs-toolbar input[type="search"] { flex: 1; min-width: 150px; }

    .section-cap {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .chip-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .chip {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .doc-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .doc-card {
      width: 100%;
      text-align: left;
      padding: 14px 15px;
      border-radius: 14px;
      background: #faf5ec;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 7px;
      cursor: pointer;
      font-family: inherit;
      color: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .doc-card:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 14px rgba(139, 90, 43, 0.12);
    }

    .doc-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .doc-title {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.4;
      word-break: break-word;
    }

    .doc-chip {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      border: 1px solid #decab0;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .doc-preview {
      font-size: 12.5px;
      color: #5a4a39;
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .doc-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    /* Document viewer / editor modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(47, 38, 29, 0.45);
      display: none;
      z-index: 60;
      padding: 12px;
      overflow-y: auto;
    }

    .modal.open { display: block; }

    .modal-card {
      max-width: 760px;
      margin: 20px auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(47, 38, 29, 0.3);
      display: flex;
      flex-direction: column;
      max-height: calc(100dvh - 40px);
      overflow: hidden;
    }

    .modal-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.35;
      word-break: break-word;
    }

    .modal-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-foot {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .icon-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 10px;
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      cursor: pointer;
      font-size: 15px;
      color: var(--text);
    }

    .danger { color: #c23939 !important; }

    /* Rendered markdown */
    .md {
      font-size: 14px;
      line-height: 1.72;
      word-break: break-word;
    }

    .md > :first-child { margin-top: 0; }
    .md h1, .md h2, .md h3 { line-height: 1.35; margin: 1.1em 0 0.45em; }
    .md h1 { font-size: 20px; }
    .md h2 { font-size: 17px; }
    .md h3 { font-size: 15px; }
    .md p { margin: 0.55em 0; }
    .md ul, .md ol { margin: 0.55em 0; padding-left: 1.35em; }
    .md li > ul, .md li > ol { margin: 0.2em 0; }
    .md li { margin: 0.22em 0; }
    .md code {
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 5px;
      font-size: 0.9em;
    }
    .md pre {
      background: #2f261d;
      color: #f6f1e7;
      padding: 12px;
      border-radius: 10px;
      overflow-x: auto;
    }
    .md pre code { background: none; border: none; color: inherit; padding: 0; }
    .md blockquote {
      margin: 0.6em 0;
      padding: 0.1em 0 0.1em 12px;
      border-left: 3px solid var(--border);
      color: var(--muted);
    }
    .md hr { border: none; border-top: 1px dashed var(--border); margin: 1.1em 0; }
    .md a { color: var(--accent-dark); text-decoration: underline; }
    .md strong { font-weight: 800; }

    .editor-form {
      padding: 14px 16px 16px;
      display: none;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .editor-form.open { display: flex; }

    .editor-form textarea {
      min-height: 240px;
      resize: vertical;
      line-height: 1.6;
      font-size: 13.5px;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 28px 12px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Top Header -->
    <header class="card header">
      <div class="brand">
        <div class="brand-icon">👑</div>
        <div>
          <div class="brand-title">모소 월드</div>
          <div class="brand-sub"><span class="dot"></span> 동원 님 전용 비서실</div>
        </div>
      </div>
      <div id="connPill" class="status-pill">
        <span class="dot"></span>
        <span id="connText">실시간 연결</span>
      </div>
    </header>

    <!-- Main Tabs -->
    <nav class="card main-tabs">
      <button class="tab-btn active" data-tab="meeting">
        <span class="ico">💬</span>
        <span>회의실</span>
      </button>
      <button class="tab-btn" data-tab="tasks">
        <span class="ico">📋</span>
        <span>작업실</span>
      </button>
      <button class="tab-btn" data-tab="agents">
        <span class="ico">📊</span>
        <span>비서현황</span>
      </button>
      <button class="tab-btn" data-tab="docs">
        <span class="ico">📁</span>
        <span>저장소</span>
      </button>
    </nav>

    <!-- Panel 1: 회의실 (통합) -->
    <section id="panel-meeting" class="panel active">
      <div class="card chat-box">
        <div class="room-meta">
          <span id="roomLabel">💬 회의실 · ON 3명</span>
          <button class="btn-ghost" onclick="loadAll()">새로고침</button>
        </div>
        <div id="chatList" class="chat-list">
          <div class="empty">메시지를 불러오는 중...</div>
        </div>
        <form class="chat-compose" onsubmit="sendMessage(event)">
          <input id="msgInput" type="text" placeholder="회의실에 메시지 남기기..." autocomplete="off" />
          <button class="btn" type="submit">전송</button>
        </form>
      </div>
    </section>

    <!-- Panel 2: 작업실 -->
    <section id="panel-tasks" class="panel">
      <div class="card section-card">
        <h2 class="section-title">✍️ 새 지시 내리기</h2>
        <form class="task-form" onsubmit="addTask(event)">
          <input id="taskTitle" type="text" placeholder="예: 신동투 비서에게 오늘 스레드 글감 5선 찾아오기" autocomplete="off" />
          <div class="task-form-row">
            <select id="taskAssignee">
              <option value="공동">공동</option>
              <option value="피클">피클</option>
              <option value="피자">피자</option>
              <option value="효주 님 비서">효주 님 비서</option>
            </select>
            <button class="btn" type="submit">지시 추가</button>
          </div>
        </form>
      </div>

      <div class="card section-card">
        <h2 class="section-title">📌 진행 중인 지시</h2>
        <div id="taskList" class="task-list">
          <div class="empty">지시를 불러오는 중...</div>
        </div>
      </div>
    </section>

    <!-- Panel 3: 비서현황 -->
    <section id="panel-agents" class="panel">
      <div id="agentsGrid" class="agents-grid">
        <div class="empty">비서 현황을 불러오는 중...</div>
      </div>
    </section>

    <!-- Panel 4: 저장소 -->
    <section id="panel-docs" class="panel">
      <div class="card section-card">
        <h2 class="section-title">📁 저장소 <span class="section-cap">지침서 · 리스팅 문서 보관함</span></h2>
        <div class="docs-toolbar">
          <input id="docSearch" type="search" placeholder="제목 · 본문 검색" autocomplete="off" oninput="renderDocs()" />
          <button class="btn-ghost" id="docSortBtn" onclick="toggleDocSort()">제목순 ▾</button>
          <button class="btn" type="button" onclick="openDocEditor()">＋ 새 문서</button>
        </div>
        <div id="docChips" class="chip-row"></div>
      </div>

      <div class="card section-card">
        <div id="docList" class="doc-list">
          <div class="empty">문서를 불러오는 중...</div>
        </div>
      </div>
    </section>
  </div>

  <!-- Document viewer / editor -->
  <div id="docModal" class="modal" onclick="if (event.target === this) closeDocModal()">
    <div class="modal-card">
      <div class="modal-head">
        <div style="min-width: 0;">
          <div id="viewerTitle" class="modal-title"></div>
          <div id="viewerMeta" class="modal-meta"></div>
        </div>
        <button class="icon-btn" type="button" onclick="closeDocModal()" aria-label="닫기">✕</button>
      </div>

      <div id="viewerBody" class="modal-body">
        <div id="viewerMd" class="md"></div>
      </div>

      <form id="editorForm" class="editor-form" onsubmit="saveDoc(event)">
        <input id="editDocTitle" type="text" placeholder="문서 제목  예) 📘 [Side Hustle] 00. 마스터 지침" autocomplete="off" />
        <input id="editDocAuthor" type="text" placeholder="작성자 · 카테고리  예) 피클 · Side Hustle" autocomplete="off" />
        <textarea id="editDocContent" placeholder="마크다운으로 작성하세요.  # 제목, ## 소제목, - 목록, **강조**, `코드` 지원"></textarea>
      </form>

      <div id="viewerFoot" class="modal-foot">
        <button class="btn-ghost" type="button" id="copyBtn" onclick="copyDocBody()">📋 본문 복사</button>
        <button class="btn-ghost" type="button" onclick="editCurrentDoc()">✏️ 수정</button>
        <button class="btn-ghost danger" type="button" onclick="deleteCurrentDoc()">🗑 삭제</button>
        <button class="btn" type="button" onclick="closeDocModal()">닫기</button>
      </div>

      <div id="editorFoot" class="modal-foot" style="display: none;">
        <button class="btn-ghost" type="button" onclick="cancelEdit()">취소</button>
        <button class="btn" type="submit" form="editorForm">저장</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://fqvqjhsjxhkuxlmchqle.supabase.co";
    const SUPABASE_KEY = "sb_publishable_xr76O_ovCMcLAZEameYa_Q_xRhJOWVi";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Main tab switching
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
      });
    });

    // (회의실은 단일 방으로 통합. 예전 room 값도 모두 함께 읽어온다.)

    function fmtTime(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      return d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    }

    function fmtDateTime(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      return d.toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function linkify(str) {
      const safe = escapeHtml(str);
      return safe.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    }

    async function loadMessages() {
      // 통합 회의실: room 값(main / command / lounge / 그 외)과 상관없이 모두 불러온다.
      const { data, error } = await db
        .from("messages")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(200);

      const list = document.getElementById("chatList");
      if (error) {
        list.innerHTML = `<div class="empty">불러오기 오류: ${escapeHtml(error.message)}</div>`;
        return;
      }
      if (!data || data.length === 0) {
        list.innerHTML = `<div class="empty">아직 대화가 없어요. 첫 메시지를 남겨보세요!</div>`;
        return;
      }

      const rows = data.slice().reverse();
      list.innerHTML = rows.map(m => `
        <div class="msg-row ${m.sender_role === '대표' ? 'is-owner' : ''}">
          <div class="msg-avatar">${escapeHtml(m.sender_emoji || '🥒')}</div>
          <div class="msg-body-wrap">
            <div class="msg-head">
              <span class="msg-name">${escapeHtml(m.sender_name)}</span>
              <span class="msg-role">${escapeHtml(m.sender_role)}</span>
              <span class="msg-time">${fmtTime(m.created_at)}</span>
            </div>
            <div class="msg-bubble">${linkify(m.body)}</div>
          </div>
        </div>
      `).join("");
      list.scrollTop = list.scrollHeight;
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      await db.from("messages").insert([{
        room: "main",
        sender_name: "동원",
        sender_role: "대표",
        sender_emoji: "👑",
        body: text
      }]);
    }

    async function loadTasks() {
      const { data, error } = await db
        .from("tasks")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(50);

      const list = document.getElementById("taskList");
      if (error) {
        list.innerHTML = `<div class="empty">불러오기 오류: ${escapeHtml(error.message)}</div>`;
        return;
      }
      if (!data || data.length === 0) {
        list.innerHTML = `<div class="empty">등록된 지시가 없어요. 위에서 새 지시를 내려보세요!</div>`;
        return;
      }

      list.innerHTML = data.map(t => `
        <div class="task-item">
          <div class="task-top">
            <div class="task-title">${escapeHtml(t.title)}</div>
            <div class="badges">
              <span class="badge badge-assignee">${escapeHtml(t.assignee)}</span>
              <span class="badge badge-${escapeHtml(t.status)}">${escapeHtml(t.status)}</span>
            </div>
          </div>
          ${t.result ? `<div class="task-result">${linkify(t.result)}</div>` : ""}
          <div class="task-actions">
            <span>${fmtDateTime(t.created_at)}</span>
            <div style="display:flex; gap:6px;">
              <button class="btn-ghost" onclick="cycleTask(${t.id}, '${escapeHtml(t.status)}')">상태 변경</button>
              <button class="btn-ghost" onclick="deleteTask(${t.id})">삭제</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    async function addTask(e) {
      e.preventDefault();
      const input = document.getElementById("taskTitle");
      const title = input.value.trim();
      if (!title) return;
      const assignee = document.getElementById("taskAssignee").value;
      input.value = "";
      await db.from("tasks").insert([{ title, assignee, status: "대기" }]);
    }

    async function cycleTask(id, current) {
      const next = current === "대기" ? "진행중" : current === "진행중" ? "완료" : "대기";
      await db.from("tasks").update({ status: next, updated_at: new Date().toISOString() }).eq("id", id);
    }

    async function deleteTask(id) {
      await db.from("tasks").delete().eq("id", id);
    }

    async function loadAgents() {
      const { data, error } = await db.from("agents").select("*").order("id");
      const grid = document.getElementById("agentsGrid");
      if (error || !data) {
        grid.innerHTML = `<div class="empty">비서 현황을 불러올 수 없어요.</div>`;
        return;
      }
      grid.innerHTML = data.map(a => {
        const badgeCls = a.status === "작업중" ? "badge-진행중" : a.status === "온라인" ? "badge-완료" : "badge-대기";
        return `
          <div class="card agent-card">
            <div class="agent-head">
              <div class="agent-who">
                <div class="agent-emoji">${escapeHtml(a.emoji)}</div>
                <div>
                  <div class="agent-name">${escapeHtml(a.name)}</div>
                  <div class="agent-role">${escapeHtml(a.role)}</div>
                </div>
              </div>
              <span class="badge ${badgeCls}">${escapeHtml(a.status)}</span>
            </div>
            <div class="agent-task">${escapeHtml(a.current_task || "대기 중")}</div>
            <div style="font-size:11px; color:var(--muted);">업데이트: ${fmtDateTime(a.updated_at)}</div>
          </div>
        `;
      }).join("");
    }

    /* ---------- 📁 저장소 (문서 보관함) ---------- */
    let docData = [];
    let docSort = "title";        // title | recent
    let activeCategory = "전체";
    let currentDocId = null;
    let editingDocId = null;

    function docCategory(d) {
      const m = String(d.title || "").match(/\[([^\]]+)\]/);
      return m ? m[1].trim() : "일반";
    }

    function docSortKey(t) {
      // 앞의 이모지·공백을 뺀 뒤 비교해야 00 → 01 → 02 → 03 순서가 지켜진다.
      return String(t || "").replace(/^[^\p{L}\p{N}\[]+/u, "");
    }

    function stripMd(src) {
      return String(src || "")
        .replace(/```[\s\S]*?```/g, " ")
        .replace(/!\[[^\]]*\]\([^)]*\)/g, " ")
        .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
        .replace(/[#>*_`~|]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    async function loadDocs() {
      const { data, error } = await db
        .from("memos")
        .select("*")
        .order("updated_at", { ascending: false })
        .limit(200);

      const list = document.getElementById("docList");
      if (error) {
        list.innerHTML = `<div class="empty">문서 불러오기 오류: ${escapeHtml(error.message)}</div>`;
        return;
      }
      docData = data || [];
      renderDocs();
    }

    function toggleDocSort() {
      docSort = docSort === "title" ? "recent" : "title";
      document.getElementById("docSortBtn").textContent = docSort === "title" ? "제목순 ▾" : "최신순 ▾";
      renderDocs();
    }

    function renderDocs() {
      const chipsEl = document.getElementById("docChips");
      const listEl = document.getElementById("docList");

      const cats = ["전체", ...Array.from(new Set(docData.map(docCategory)))];
      if (!cats.includes(activeCategory)) activeCategory = "전체";
      chipsEl.innerHTML = docData.length
        ? cats.map(c => `<button class="chip ${c === activeCategory ? "active" : ""}" type="button" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join("")
        : "";
      chipsEl.querySelectorAll(".chip").forEach(b => {
        b.addEventListener("click", () => { activeCategory = b.dataset.cat; renderDocs(); });
      });

      const q = (document.getElementById("docSearch").value || "").trim().toLowerCase();
      const rows = docData.filter(d =>
        (activeCategory === "전체" || docCategory(d) === activeCategory) &&
        (!q || `${d.title || ""} ${d.content || ""} ${d.author || ""}`.toLowerCase().includes(q))
      );

      rows.sort((a, b) => {
        if (docSort === "recent") return new Date(b.updated_at || 0) - new Date(a.updated_at || 0);
        return docSortKey(a.title).localeCompare(docSortKey(b.title), "ko", { numeric: true });
      });

      if (!docData.length) {
        listEl.innerHTML = `<div class="empty">아직 보관된 문서가 없어요. 위의 <b>＋ 새 문서</b>로 첫 문서를 등록해보세요!</div>`;
        return;
      }
      if (!rows.length) {
        listEl.innerHTML = `<div class="empty">조건에 맞는 문서가 없어요.</div>`;
        return;
      }

      listEl.innerHTML = rows.map(d => `
        <div class="doc-card" data-id="${d.id}">
          <div class="doc-card-top">
            <div class="doc-title">${escapeHtml(d.title || "(제목 없음)")}</div>
            <span class="doc-chip">${escapeHtml(docCategory(d))}</span>
          </div>
          <div class="doc-preview">${escapeHtml(stripMd(d.content).slice(0, 170))}</div>
          <div class="doc-foot">
            <span>${escapeHtml(d.author || "작성자 미지정")}</span>
            <span>${fmtDateTime(d.updated_at)}</span>
          </div>
        </div>
      `).join("");
      listEl.querySelectorAll(".doc-card").forEach(card => {
        card.addEventListener("click", () => openDoc(Number(card.dataset.id)));
      });
    }

    function openDoc(id) {
      const doc = docData.find(d => d.id === id);
      if (!doc) return;
      currentDocId = id;
      editingDocId = null;
      document.getElementById("viewerTitle").textContent = doc.title || "(제목 없음)";
      document.getElementById("viewerMeta").textContent =
        `${doc.author || "작성자 미지정"} · ${docCategory(doc)} · 최종 수정 ${fmtDateTime(doc.updated_at)}`;
      document.getElementById("viewerMd").innerHTML = renderMarkdown(doc.content || "");
      document.getElementById("copyBtn").textContent = "📋 본문 복사";
      showViewerPane();
      document.getElementById("docModal").classList.add("open");
      document.getElementById("viewerBody").scrollTop = 0;
    }

    function showViewerPane() {
      document.getElementById("viewerBody").style.display = "";
      document.getElementById("viewerFoot").style.display = "flex";
      document.getElementById("editorForm").classList.remove("open");
      document.getElementById("editorFoot").style.display = "none";
    }

    function closeDocModal() {
      document.getElementById("docModal").classList.remove("open");
      currentDocId = null;
      editingDocId = null;
    }

    function openDocEditor(id) {
      editingDocId = id || null;
      const doc = id ? docData.find(d => d.id === id) : null;
      document.getElementById("editDocTitle").value = doc ? doc.title || "" : "";
      document.getElementById("editDocAuthor").value = doc ? doc.author || "" : "피클";
      document.getElementById("editDocContent").value = doc ? doc.content || "" : "";
      document.getElementById("viewerTitle").textContent = doc ? "✏️ 문서 수정" : "📄 새 문서 작성";
      document.getElementById("viewerMeta").textContent = doc
        ? "저장하면 수정 시각이 갱신돼요."
        : "마크다운(#·##·-·**·`)으로 작성할 수 있어요.";
      document.getElementById("viewerBody").style.display = "none";
      document.getElementById("viewerFoot").style.display = "none";
      document.getElementById("editorForm").classList.add("open");
      document.getElementById("editorFoot").style.display = "flex";
      document.getElementById("docModal").classList.add("open");
      document.getElementById("editDocTitle").focus();
    }

    function editCurrentDoc() {
      if (currentDocId) openDocEditor(currentDocId);
    }

    function cancelEdit() {
      if (editingDocId) {
        const id = editingDocId;
        editingDocId = null;
        openDoc(id);
      } else {
        closeDocModal();
      }
    }

    async function saveDoc(e) {
      e.preventDefault();
      const title = document.getElementById("editDocTitle").value.trim();
      const author = document.getElementById("editDocAuthor").value.trim();
      const content = document.getElementById("editDocContent").value;
      if (!title) { alert("문서 제목을 입력해 주세요."); return; }

      const payload = { title, author: author || "피클", content, updated_at: new Date().toISOString() };

      if (editingDocId) {
        const targetId = editingDocId;
        const { error } = await db.from("memos").update(payload).eq("id", targetId);
        if (error) { alert("수정에 실패했어요: " + error.message); return; }
        editingDocId = null;
        await loadDocs();
        openDoc(targetId);
      } else {
        const { data, error } = await db.from("memos").insert([payload]).select();
        if (error) { alert("저장에 실패했어요: " + error.message); return; }
        const newId = data && data[0] ? data[0].id : null;
        await loadDocs();
        if (newId && docData.some(d => d.id === newId)) {
          activeCategory = "전체";
          renderDocs();
          openDoc(newId);
        } else {
          closeDocModal();
        }
      }
    }

    async function deleteCurrentDoc() {
      const doc = docData.find(d => d.id === currentDocId);
      if (!doc) return;
      if (!confirm(`「${doc.title || "(제목 없음)"}」 문서를 저장소에서 삭제할까요?`)) return;
      const { error } = await db.from("memos").delete().eq("id", doc.id);
      if (error) { alert("삭제에 실패했어요: " + error.message); return; }
      closeDocModal();
      await loadDocs();
    }

    async function copyDocBody() {
      const doc = docData.find(d => d.id === currentDocId);
      if (!doc) return;
      const text = doc.content || "";
      let ok = false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          ok = true;
        }
      } catch (err) { ok = false; }
      if (!ok) {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
        document.body.removeChild(ta);
      }
      const btn = document.getElementById("copyBtn");
      btn.textContent = ok ? "✅ 본문 복사됨" : "⚠️ 복사 실패";
      setTimeout(() => { btn.textContent = "📋 본문 복사"; }, 1600);
    }

    function inlineMd(text) {
      const store = [];
      const keep = html => { store.push(html); return `\u0001${store.length - 1}\u0001`; };
      let t = text;
      t = t.replace(/`([^`]+)`/g, (_, c) => keep(`<code>${c}</code>`));
      t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, label, url) =>
        keep(`<a href="${url}" target="_blank" rel="noopener">${label}</a>`));
      t = t.replace(/(https?:\/\/[^\s<]+[^\s<.,)])/g, u =>
        keep(`<a href="${u}" target="_blank" rel="noopener">${u}</a>`));
      t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
      return t.replace(/\u0001(\d+)\u0001/g, (_, i) => store[Number(i)]);
    }

    function buildList(items) {
      let idx = 0;
      function walk(indent) {
        const tag = items[idx].ordered ? "ol" : "ul";
        let html = `<${tag}>`;
        while (idx < items.length) {
          const it = items[idx];
          if (it.indent < indent) break;
          if (it.indent > indent) { html += walk(it.indent); continue; }
          idx++;
          let text = it.text;
          const box = /^\[( |x|X)\]\s+/.exec(text);
          if (box) {
            text = (box[1].toLowerCase() === "x" ? "☑ " : "☐ ") + inlineMd(text.slice(box[0].length));
          } else {
            text = inlineMd(text);
          }
          html += `<li>${text}`;
          if (idx < items.length && items[idx].indent > indent) html += walk(items[idx].indent);
          html += "</li>";
        }
        return html + `</${tag}>`;
      }
      return walk(items[0].indent);
    }

    function renderMarkdown(src) {
      const lines = escapeHtml(String(src || "")).split(/\r?\n/);
      const out = [];
      const para = [];
      const flush = () => {
        if (para.length) {
          out.push(`<p>${para.map(inlineMd).join("<br>")}</p>`);
          para.length = 0;
        }
      };

      let i = 0;
      while (i < lines.length) {
        const line = lines[i];

        if (/^\s*```/.test(line)) {
          flush();
          const buf = [];
          i++;
          while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
          i++;
          out.push(`<pre><code>${buf.join("\n")}</code></pre>`);
          continue;
        }

        if (!line.trim()) { flush(); i++; continue; }

        let m = /^(#{1,6})\s+(.*)$/.exec(line);
        if (m) {
          flush();
          const lv = Math.min(m[1].length, 3);
          out.push(`<h${lv}>${inlineMd(m[2].replace(/\s+#+\s*$/, ""))}</h${lv}>`);
          i++;
          continue;
        }

        if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
          flush();
          out.push("<hr>");
          i++;
          continue;
        }

        if (/^\s*(?:>|&gt;)\s?/.test(line)) {
          flush();
          const buf = [];
          while (i < lines.length && /^\s*(?:>|&gt;)\s?/.test(lines[i])) {
            buf.push(lines[i].replace(/^\s*(?:>|&gt;)\s?/, ""));
            i++;
          }
          out.push(`<blockquote>${buf.map(inlineMd).join("<br>")}</blockquote>`);
          continue;
        }

        if (/^\s*[-*+]\s+/.test(line) || /^\s*\d+[.)]\s+/.test(line)) {
          flush();
          const items = [];
          while (i < lines.length) {
            const cur = lines[i];
            const mm = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(cur);
            if (mm) {
              items.push({
                indent: mm[1].replace(/\t/g, "  ").length,
                ordered: /\d/.test(mm[2]),
                text: mm[3]
              });
              i++;
              continue;
            }
            if (cur.trim() && items.length && !/^#{1,6}\s/.test(cur) && !/^\s*```/.test(cur)) {
              items[items.length - 1].text += " " + cur.trim();
              i++;
              continue;
            }
            break;
          }
          out.push(buildList(items));
          continue;
        }

        para.push(line);
        i++;
      }
      flush();
      return out.join("\n");
    }

    document.addEventListener("keydown", ev => {
      if (ev.key === "Escape") closeDocModal();
    });

    function loadAll() {
      loadMessages();
      loadTasks();
      loadAgents();
      loadDocs();
    }

    // Realtime subscription
    const channel = db.channel("moso-world-live")
      .on("postgres_changes", { event: "*", schema: "public", table: "messages" }, () => loadMessages())
      .on("postgres_changes", { event: "*", schema: "public", table: "tasks" }, () => loadTasks())
      .on("postgres_changes", { event: "*", schema: "public", table: "agents" }, () => loadAgents())
      .on("postgres_changes", { event: "*", schema: "public", table: "memos" }, () => loadDocs())
      .subscribe((status) => {
        const pill = document.getElementById("connPill");
        const text = document.getElementById("connText");
        if (status === "SUBSCRIBED") {
          pill.classList.remove("offline");
          text.textContent = "실시간 연결";
        } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
          pill.classList.add("offline");
          text.textContent = "재연결 중";
        }
      });

    loadAll();
  </script>
